<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} — Sadjad (Mo) Asadi</title>
    <meta name="description" content="{{ page.description }}">
    <meta name="author" content="Sadjad (Mo) Asadi">
    <meta name="theme-color" content="#222933">
    <link rel="canonical" href="{{ site.url }}{{ page.permalink }}">

    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Sadjad (Mo) Asadi">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ page.description }}">
    <meta property="og:url" content="{{ site.url }}{{ page.permalink }}">
    <meta property="og:image" content="{{ site.url }}/assets/images/og-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title }}">
    <meta name="twitter:description" content="{{ page.description }}">
    <meta name="twitter:image" content="{{ site.url }}/assets/images/og-card.png">
    {% if page.date %}<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">{% endif %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
    <link href="/assets/css/writing.css" rel="stylesheet">
</head>
<body>
<div class="wrap">
    <nav class="topbar">
        <a href="/">Sadjad (Mo) Asadi</a>
        <span class="sep">/</span>
        <a href="/writing/">Writing</a>
    </nav>

    <article>
        <header class="piece-head">
            <h1>{{ page.title }}</h1>
            {% if page.date %}<p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %Y" }}</time></p>{% endif %}
        </header>

        {{ content }}
    </article>

    <footer class="piece-foot">
        <a href="/writing/">← More writing</a>
    </footer>
</div>
</body>
</html>
